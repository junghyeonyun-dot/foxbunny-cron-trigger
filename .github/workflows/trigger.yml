name: foxbunny-autopost-trigger

on:
  # PAUSED 2026-08-28: 계정 Actions 쿼터가 사실상 바닥나서(2,000분 중 1,990분 소진)
  # 9월 초 리셋될 때까지 자동 발행/답글/인사이트수집을 전부 멈추기로 함(사용자 요청).
  # 게시물은 사용자가 수동 업로드, 답글은 별도 스킬로 초안만 생성해서 사용자가 직접 게시.
  # 리셋 후 재개하려면 아래 schedule 블록 주석 해제.
  schedule:
    - cron: '30 20 * * 0,1,2,3,4'
    - cron: '30 10 * * 1,2,3,4'
    - cron: '30 13 * * 5,6'
    - cron: '30 23 * * 5,6'
    - cron: '30 5 * * 0'
    - cron: '0 */8 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      target_workflow:
        description: '테스트용: 강제로 호출할 워크플로 파일명'
        required: false
        type: choice
        options:
          - reply-check.yml
          - daily.yml
          - metrics-fetch.yml
        default: reply-check.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target workflow
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow=${{ inputs.target_workflow }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "30 20 * * 0,1,2,3,4"|"30 10 * * 1,2,3,4"|"30 13 * * 5,6"|"30 23 * * 5,6"|"30 5 * * 0")
                echo "workflow=daily.yml" >> "$GITHUB_OUTPUT" ;;
              "0 */8 * * *")
                echo "workflow=reply-check.yml" >> "$GITHUB_OUTPUT" ;;
              "0 23 * * *")
                echo "workflow=metrics-fetch.yml" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "workflow=reply-check.yml" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Trigger target workflow via API
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.FOXBUNNY_AUTOPOST_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/junghyeonyun-dot/foxbunny-autopost/actions/workflows/${{ steps.target.outputs.workflow }}/dispatches \
            -d '{"ref":"main"}'
          echo "dispatched ${{ steps.target.outputs.workflow }}"
