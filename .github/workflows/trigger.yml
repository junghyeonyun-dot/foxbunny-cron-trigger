name: foxbunny-autopost-trigger

on:
  # 2026-09-02: 8/28 일시정지 해제. 자동 발행(daily.yml)과 자동 답글(reply-check.yml)만 재개.
  # 인사이트 수집(metrics-fetch.yml)과 주간 KPI 설정(weekly-kpi.yml)은 사용자가 필요할 때 직접 수동 실행.
  # 2026-09-29: 자동 발행 하루 2회 -> 4회로 확대(경쟁 계정 하루 4~6회 대비). 시각은 KST 기준, 간격 최소 3시간 전후.
  #   평일: 05:30 / 12:30 / 19:30 / 22:30   토: 08:30 / 12:30 / 18:30 / 22:30   일: 08:30 / 14:30 / 18:30 / 22:30
  # 2026-09-29: 정각·30분은 GitHub 예약 실행이 몰려 몇 시간씩 밀리거나 누락돼서(9/28 19:30·22:30 누락, 새벽에 몰려 실행) 붐비지 않는 :17/:47로 옮김.
  #   평일: 05:17 / 12:47 / 19:17 / 22:17   토: 08:17 / 12:47 / 18:17 / 22:17   일: 08:17 / 14:47 / 18:17 / 22:17
  schedule:
    - cron: '17 20 * * 0,1,2,3,4'   # 월~금 05:17
    - cron: '47 3 * * 1,2,3,4,5,6'  # 월~토 12:47
    - cron: '17 10 * * 1,2,3,4,5'   # 월~금 19:17
    - cron: '17 13 * * *'           # 매일 22:17
    - cron: '17 23 * * 5,6'         # 토·일 08:17
    - cron: '47 5 * * 0'            # 일 14:47
    - cron: '17 9 * * 0,6'          # 토·일 18:17
    - cron: '7 */8 * * *'
  workflow_dispatch:
    inputs:
      target_workflow:
        description: '테스트용: 강제로 호출할 워크플로 파일명'
        required: false
        type: choice
        options:
          - reply-check.yml
          - daily.yml
          - metrics-fetch.yml
          - weekly-kpi.yml
        default: reply-check.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target workflow
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow=${{ inputs.target_workflow }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "17 20 * * 0,1,2,3,4"|"47 3 * * 1,2,3,4,5,6"|"17 10 * * 1,2,3,4,5"|"17 13 * * *"|"17 23 * * 5,6"|"47 5 * * 0"|"17 9 * * 0,6")
                echo "workflow=daily.yml" >> "$GITHUB_OUTPUT" ;;
              "7 */8 * * *")
                echo "workflow=reply-check.yml" >> "$GITHUB_OUTPUT" ;;
              "0 23 * * *")
                echo "workflow=metrics-fetch.yml" >> "$GITHUB_OUTPUT" ;;
              "0 0 * * 1")
                echo "workflow=weekly-kpi.yml" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "workflow=reply-check.yml" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Trigger target workflow via API
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.FOXBUNNY_AUTOPOST_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/junghyeonyun-dot/foxbunny-autopost/actions/workflows/${{ steps.target.outputs.workflow }}/dispatches \
            -d '{"ref":"main"}'
          echo "dispatched ${{ steps.target.outputs.workflow }}"
